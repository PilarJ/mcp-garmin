[project]
name = "mcp-garmin"
version = "0.1.0"
description = "MCP server exposing Garmin Connect over Streamable HTTP with GitHub OAuth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.5,<4",
    # Garmin Connect is undocumented and changes without notice; pin tightly
    # and upgrade deliberately.
    "garminconnect==0.3.8",
    "anyio>=4.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-auth = "garmin_mcp.authcli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
